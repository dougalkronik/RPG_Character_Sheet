<h1>Inventory</h1>

<!-- ===============================
     ADD ITEM
     =============================== -->

<h2>Possessions</h2>
<h3>Add Item</h3>

<label>Item Name</label>
<input type="text" id="itemName">

<label>Item Type</label>
<select id="itemType">
    <option>Armour</option>
    <option>Weapon</option>
    <option>Ammunition</option>
    <option>Consumable</option>
    <option>Equipment</option>
    <option>Clothing</option>
    <option>Ring</option>
    <option>Earring</option>
    <option>Necklace</option>
    <option>Storage</option>
</select>

<label>Storage Location</label>
<select id="itemLocation">
    <option>None</option>
    <option>Worn</option>
    <option>Belt</option>
    <option>Backpack</option>
    <option>Mount</option>
    <option>Home</option>
    <option>Left Hand</option>
    <option>Right Hand</option>
    <option>Both Hands</option>
</select>

<label>Worn Slot (only if Worn)</label>
<select id="wornSlot" disabled>
    <option>Head</option>
    <option>Body</option>
    <option>Left Arm</option>
    <option>Left Hand</option>
    <option>Right Arm</option>
    <option>Right Hand</option>
    <option>Left Leg</option>
    <option>Right Leg</option>
    <option>Cloak</option>
    <option>Vest</option>
</select>

<label>Size of Item</label>
<select id="itemSize">
    <option>Tiny (1x1)</option>
    <option>Small (2x2)</option>
    <option>Medium (3x3)</option>
    <option>Large (5x5)</option>
    <option>Huge (10x10)</option>
    <option>Massive (25x25)</option>
    <option>Gargantuan (50x50)</option>
    <option>Other</option>
</select>

<label>Stackable</label>
<input type="checkbox" id="itemStackable">

<label>Quantity</label>
<input type="number" id="itemQuantity" value="1" min="1">

<label>Bonus Type</label>
<select id="itemBonusType">
    <option>None</option>
    <option>Armour</option>
    <option>Damage</option>
    <option>Melee Attack</option>
    <option>Ranged Attack</option>
    <option>Arcane Ability</option>
    <option>Divinity Ability</option>
    <option>Nature Ability</option>
    <option>Command</option>
    <option>Tactical Control</option>
    <option>Strategic Control</option>
</select>

<label>Bonus Value</label>
<input type="number" id="itemBonusValue" value="0">

<label>Weapon Category</label>
<select id="weaponCategory" disabled>
    <option>Melee</option>
    <option>Ranged</option>
    <option>Arcane</option>
    <option>Divine</option>
    <option>Nature</option>
</select>

<label>Ammunition Used</label>
<select id="ammoUsed" disabled>
    <option>None</option>
</select>

<label>Weapon Used By</label>
<select id="weaponUsedBy" disabled>
    <option>None</option>
</select>

<label>Ammunition Element Name</label>
<input type="text" id="ammoElementName" disabled>

<label>Capacity</label>
<input type="number" id="ammoCapacity" value="0" disabled>

<label>Quantity</label>
<input type="number" id="ammoQuantity" value="1" min="1" disabled>

<label>Storage Slots</label>
<input type="number" id="itemSlots" value="1" min="1" disabled>

<button id="addItemBtn">Add Item</button>

<!-- ===============================
     INVENTORY LIST
     =============================== -->

<h3>
    Inventory List
    Type:
    <select id="filterType">
        <option value="All">All</option>
        <option>Armour</option>
        <option>Weapon</option>
        <option>Ammunition</option>
        <option>Consumable</option>
        <option>Equipment</option>
        <option>Clothing</option>
        <option>Ring</option>
        <option>Earring</option>
        <option>Necklace</option>
        <option>Storage</option>
    </select>
    Location:
    <select id="filterLocation">
        <option value="All">All</option>
        <option>Worn</option>
        <option>Belt</option>
        <option>Backpack</option>
        <option>Mount</option>
        <option>Home</option>
        <option>Left Hand</option>
        <option>Right Hand</option>
        <option>Both Hands</option>
    </select>
    Bonus:
    <select id="filterBonus">
        <option value="All">All</option>
        <option>Armour</option>
        <option>Damage</option>
        <option>Melee Attack</option>
        <option>Ranged Attack</option>
        <option>Arcane Ability</option>
        <option>Divinity Ability</option>
        <option>Nature Ability</option>
        <option>Command</option>
        <option>Tactical Control</option>
        <option>Strategic Control</option>
    </select>
</h3>

<ul id="inventoryList"></ul>

<hr>

<!-- ===============================
     TREASURE SYSTEM
     =============================== -->

<h2>Treasure — Total Assets: <span id="totalAssets">0</span></h2>

<h3>Add Treasure</h3>

<label>Treasure Name</label>
<input type="text" id="treasureName">

<label>Value</label>
<input type="number" id="treasureValue" value="0">

<label>Quantity</label>
<input type="number" id="treasureQuantity" value="1" min="1">

<button id="addTreasureBtn">Add Treasure</button>

<h3>Treasure List</h3>
<ul id="treasureList"></ul>

<!-- ===============================
     MONEY (Unified with Purse)
     =============================== -->

<h3>Money</h3>

<ul id="moneyList">
    <li id="moneyRow">
        <strong>Money</strong><br>
        <label>Amount</label>
        <input type="number" id="moneyAmount" min="0">
        <button id="moneyMinus">-</button>
        <button id="moneyPlus">+</button>
    </li>
</ul>

<script src="js/shared.js"></script>
<script src="js/inventory.js"></script>

</body>
</html>
