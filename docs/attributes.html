<h1>Attributes</h1>

<!-- EXPERIENCE -->
<h2>Experience</h2>
<label>Accumulated</label>
<input type="number" id="expAccumulated" min="0">

<label>Spent</label>
<input type="number" id="expSpent" min="0">

<hr>

<!-- PHYSICAL -->
<h2>Physical Aspects</h2>
<div id="physicalContainer"></div>

<!-- MENTAL -->
<h2>Mental Aspects</h2>
<div id="mentalContainer"></div>

<!-- ABILITIES -->
<h2>Abilities</h2>
<div id="abilitiesContainer"></div>

<hr>

<!-- SKILLS -->
<h2>
    Skills
    <select id="skillSort">
        <option value="All">All</option>
        <option value="Melee">Melee</option>
        <option value="Ranged">Ranged</option>
        <option value="Arcane">Arcane</option>
        <option value="Divine">Divine</option>
        <option value="Nature">Nature</option>
    </select>
</h2>

<h3>Add Skill</h3>

<label>Skill Name</label>
<input type="text" id="skillName">

<label>Attribute 1</label>
<select id="skillAttr1"></select>

<label>Attribute 2</label>
<select id="skillAttr2"></select>

<label>Ability</label>
<select id="skillAbility">
    <option>Melee</option>
    <option>Ranged</option>
    <option>Arcane</option>
    <option>Divine</option>
    <option>Nature</option>
</select>

<label>Category</label>
<select id="skillCategory">
    <option>Combat</option>
    <option>Adventure</option>
    <option>Command</option>
    <option>Tactical</option>
    <option>Strategic</option>
</select>

<button id="addSkillBtn">Add Skill</button>

<h3>Skill List</h3>
<ul id="skillList"></ul>

<script src="js/shared.js"></script>
<script src="js/attributes.js"></script>

</body>
</html>
